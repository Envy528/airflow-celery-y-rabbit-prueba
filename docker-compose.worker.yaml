# Airflow CeleryExecutor — NODO WORKER REMOTO ("esclavo").
# Úsalo en cada computador extra que quieras sumar al clúster.
#
# Requisitos en esta máquina:
#   - Carpeta ./dags con EXACTAMENTE los mismos DAGs que el maestro (sincronízala con git).
#   - Un .env con, como mínimo:
#       MASTER_IP=192.168.1.50            # IP del nodo maestro en la red
#       AIRFLOW_FERNET_KEY=...            # la misma del maestro
#       AIRFLOW_JWT_SECRET=...            # la misma del maestro
#       RABBITMQ_DEFAULT_USER=rabbit      # las mismas del maestro
#       RABBITMQ_DEFAULT_PASS=rabbit
#       WORKER_QUEUES=default             # opcional: colas que atiende este worker
#
# Levantar:   docker compose -f docker-compose.worker.yaml up -d
---
services:
  airflow-worker:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    command: celery worker -q ${WORKER_QUEUES:-default}
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # Todo apunta al maestro por su IP
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@${MASTER_IP:?Define MASTER_IP en .env}:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit}:${RABBITMQ_DEFAULT_PASS:-rabbit}@${MASTER_IP}:5672//
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@${MASTER_IP}:5432/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://${MASTER_IP}:8080/execution/
      # Secretos compartidos con el maestro
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-cambia-esto-por-un-secreto-largo}
      # Para que el maestro pueda leer los logs de este worker (puerto 8793),
      # el worker se anuncia con la IP real de esta máquina.
      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
      AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
      DUMB_INIT_SETSID: "0"
    # En Linux, la red del host hace que la IP anunciada sea la de la máquina
    # y que el puerto de logs 8793 quede accesible desde el maestro.
    network_mode: host
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
