# Airflow CeleryExecutor — NODO WORKER con Docker (Windows o Linux).
# Úsalo en cada computador con Docker que quieras sumar al clúster.
#
# Requisitos en esta máquina:
#   - Carpeta ./dags con EXACTAMENTE los mismos DAGs que el maestro (sincronízala con git).
#   - Un .env (copia de .env.example) con, como mínimo:
#       MASTER_IP=...      IP privada del maestro
#       WORKER_IP=...      IP privada de ESTA máquina (para que el maestro lea sus logs)
#       AIRFLOW_FERNET_KEY / AIRFLOW_JWT_SECRET   iguales a los del maestro
#
# En Windows:  .\iniciar_worker.ps1
# A mano:      docker compose -f docker-compose.worker.yaml up -d
---
# Nombre de proyecto propio, para no mezclarse con el compose del maestro
name: airflow-worker

services:
  airflow-worker:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    command: celery worker -q ${WORKER_QUEUES:-default}
    # El contenedor se llama como la IP de esta máquina: así el worker se
    # anuncia con ella y el maestro sabe dónde pedirle los logs.
    hostname: ${WORKER_IP:?Define WORKER_IP en .env (IP privada de esta maquina)}
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # Todo apunta al maestro por su IP
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@${MASTER_IP:?Define MASTER_IP en .env}:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit}:${RABBITMQ_DEFAULT_PASS:-rabbit}@${MASTER_IP}:5672//
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@${MASTER_IP}:5432/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://${MASTER_IP}:8080/execution/
      # Secretos compartidos con el maestro
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-cambia-esto-por-un-secreto-largo}
      # Usa el hostname del contenedor (= WORKER_IP) tal cual, sin búsquedas DNS
      AIRFLOW__CORE__HOSTNAME_CALLABLE: socket.gethostname
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
      DUMB_INIT_SETSID: "0"
    ports:
      - "8793:8793"   # Servidor de logs del worker (el maestro los lee por aquí)
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
